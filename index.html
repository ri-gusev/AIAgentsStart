<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="workspace">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark">AI</span>
        <div>
          <p>OPENAI / C++ LAB</p>
          <h1>Agent chat</h1>
        </div>
      </div>
      <div class="status"><i></i> Local backend</div>
    </header>

    <section class="question-panel">
      <div class="question-copy">
        <span>ONE AGENT</span>
        <h2>Ask a question</h2>
        <p>The agent keeps the last 15 dialog turns in the current session and checks each answer before returning it.</p>
      </div>
    </section>

    <section class="chat-log" id="chatLog" aria-live="polite">
      <div class="chat-empty">Start the conversation with a question.</div>
    </section>

    <section class="composer-panel">
      <form class="composer" id="chatForm">
        <textarea id="messageInput" rows="1" maxlength="4000" placeholder="For example: What is ESP32?" aria-label="Your question" autofocus></textarea>
        <button id="sendButton" type="submit">
          <span>Send</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <p class="hint">Enter — send · Shift + Enter — new line</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
